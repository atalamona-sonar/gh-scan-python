name: sonar-scan
# EXAMPLE ONLY (archived demo). Needs a self-hosted runner labelled `lab99`,
# a SonarQube Server reachable from it, the secret SONAR_TOKEN and the variable SONAR_HOST_URL.
# Original triggers, disabled so forks/PRs can never run this on a self-hosted runner:
#   push:         branches: [main]
#   pull_request:
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: [self-hosted, lab99]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test with coverage
        run: |
          python3 -m venv .venv
          .venv/bin/pip -q install coverage
          .venv/bin/coverage run -m unittest discover -s tests -t .
          .venv/bin/coverage xml -o coverage.xml
      - name: Scan
        run: sonar-scanner-npm
